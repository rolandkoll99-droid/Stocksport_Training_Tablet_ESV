<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Zugangscode</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #1e2b3a 0%, #2c3e50 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 450px;
            width: 100%;
        }
        
        /* Login-Karte */
        .card {
            background: rgba(44, 62, 80, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header .icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
            display: block;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ecf0f1;
        }
        .header p {
            color: #95a5a6;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        /* Formular */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #95a5a6;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 2px solid #34495e;
            background: #1e2b3a;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.3);
        }
        .form-group input.error {
            border-color: #e74c3c;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.3);
        }
        .form-group input.success {
            border-color: #2ecc71;
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.3);
        }
        
        /* Button */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }
        .btn-danger:hover {
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4);
        }
        
        /* Fehlermeldung */
        .error-msg {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
            align-items: center;
            gap: 5px;
        }
        .error-msg.show {
            display: flex;
        }
        
        .success-msg {
            color: #2ecc71;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
            align-items: center;
            gap: 5px;
        }
        .success-msg.show {
            display: flex;
        }
        
        /* Footer */
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #7f8c8d;
            border-top: 1px solid #34495e;
            padding-top: 15px;
        }
        .footer .hint {
            color: #95a5a6;
            font-size: 0.75rem;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #e74c3c;
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            opacity: 0;
            transition: 0.5s;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: #2ecc71;
            color: #1e2b3a;
        }
        
        /* Responsive */
        @media (max-width: 500px) {
            .card { padding: 25px; }
            .header h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <!-- Header -->
        <div class="header">
            <span class="icon">🔐</span>
            <h1>Zugangscode</h1>
            <p>Bitte geben Sie Ihre Zugangsdaten ein</p>
        </div>

        <!-- Login Formular -->
        <div id="loginForm">
            <div class="form-group">
                <label>👤 Benutzername</label>
                <input type="text" id="usernameInput" placeholder="z.B. Gast" autocomplete="off">
                <div class="error-msg" id="usernameError">❌ Bitte Benutzername eingeben</div>
            </div>

            <div class="form-group">
                <label>🔑 Passwort</label>
                <input type="password" id="passwordInput" placeholder="Passwort eingeben">
                <div class="error-msg" id="passwordError">❌ Bitte Passwort eingeben</div>
            </div>

            <button class="btn" id="loginBtn" onclick="login()">
                🔓 Anmelden
            </button>

            <div id="loginSuccess" class="success-msg" style="margin-top: 10px; justify-content: center;">
                ✅ Zugang erfolgreich! Weiterleitung...
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="hint">💡 Zugangsdaten wurden vom Admin vergeben</div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
    <span id="toastMsg">Fehler</span>
</div>

<script>
// ============================================
//  EINFACHER PASSWORT-LOGIN
//  Admin kann Benutzer & Passwort anpassen
// ============================================

// ============================================
// 🔧 ANPASSUNGEN FÜR ADMIN
// ============================================

// --- 1. BENUTZERDATEN (Admin kann hier ändern) ---
const USERS = {
    // Benutzername: Passwort
    'admin': 'admin123',
    'ESV': 'ESV2026',
    'TSV': 'TSV2026',
    'Dimbach': 'Dimbach2026',
    };

// --- 2. ZIEL-LINKS (Admin kann hier ändern) ---
const REDIRECT_LINKS = {
    // Benutzername: Ziel-Link
    'admin': 'index.html',
    'ESV': '05_Trainingsmodus_Pro_Tablet_V04.html',
    'TSV': '05_Trainingsmodus_Pro_Tablet_V04.html',
    'Dimbach': '05_Trainingsmodus_Pro_Tablet_V04.html',
    
};

// --- 3. WEITERLEITUNGS-VERZÖGERUNG (in ms) ---
const REDIRECT_DELAY = 1500; // 1.5 Sekunden

// ============================================
//  CODE - BITTE NICHTS ÄNDERN
// ============================================

const usernameInput = document.getElementById('usernameInput');
const passwordInput = document.getElementById('passwordInput');
const loginBtn = document.getElementById('loginBtn');
const usernameError = document.getElementById('usernameError');
const passwordError = document.getElementById('passwordError');
const loginSuccess = document.getElementById('loginSuccess');

// Enter-Taste = Login
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        login();
    }
});

// Login-Funktion
function login() {
    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();
    
    // Fehler zurücksetzen
    usernameInput.classList.remove('error', 'success');
    passwordInput.classList.remove('error', 'success');
    usernameError.classList.remove('show');
    passwordError.classList.remove('show');
    loginSuccess.classList.remove('show');
    
    // Validierung
    let hasError = false;
    
    if (!username) {
        usernameInput.classList.add('error');
        usernameError.classList.add('show');
        hasError = true;
    }
    
    if (!password) {
        passwordInput.classList.add('error');
        passwordError.classList.add('show');
        hasError = true;
    }
    
    if (hasError) {
        showToast('❌ Bitte alle Felder ausfüllen', 'error');
        return;
    }
    
    // Benutzer prüfen
    if (!USERS[username]) {
        usernameInput.classList.add('error');
        showToast('❌ Benutzername unbekannt', 'error');
        return;
    }
    
    // Passwort prüfen
    if (USERS[username] !== password) {
        passwordInput.classList.add('error');
        showToast('❌ Falsches Passwort', 'error');
        return;
    }
    
    // ✅ Login erfolgreich
    usernameInput.classList.add('success');
    passwordInput.classList.add('success');
    loginSuccess.classList.add('show');
    loginBtn.disabled = true;
    
    showToast('✅ Zugang erfolgreich!', 'success');
    
    // Weiterleitung
    const targetLink = REDIRECT_LINKS[username] || '00_Dashboard_V1.3.html';
    console.log('🔄 Weiterleitung zu:', targetLink);
    
    setTimeout(function() {
        window.location.href = targetLink;
    }, REDIRECT_DELAY);
}

// Toast anzeigen
function showToast(message, type = 'error') {
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    
    toastMsg.textContent = message;
    toast.className = 'toast';
    if (type === 'success') {
        toast.classList.add('success');
    }
    
    toast.classList.add('show');
    
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(function() {
        toast.classList.remove('show');
    }, 3000);
}

// Console Hilfe für Admin
console.log('🔐 Passwort-Login geladen!');
console.log('📋 Verfügbare Benutzer:', Object.keys(USERS).join(', '));
console.log('🔧 Admin kann Benutzer & Passwörter in der "USERS" Variable anpassen.');
</script>

</body>
</html>
